<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PoserTryHard</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a0a; font-family: Arial, sans-serif; color: #fff; }

    /* ── PRELOADER ── */
    #preloader {
      position: fixed; inset: 0; background: #0a0a0a;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      z-index: 100; transition: opacity 0.8s ease;
    }
    #preloader h1 { font-size: 13px; letter-spacing: 6px; color: #fff; text-transform: uppercase; margin-top: 24px; opacity: 0.7; }
    #preloader .sub { font-size: 10px; letter-spacing: 3px; color: #888; margin-top: 6px; text-transform: uppercase; }
    #activity-label { font-size: 11px; letter-spacing: 4px; color: #fff; margin-top: 16px; text-transform: uppercase; min-height: 18px; transition: opacity 0.3s; }
    #progress-bar { width: 200px; height: 2px; background: #222; margin-top: 20px; border-radius: 2px; overflow: hidden; }
    #progress-fill { height: 100%; background: #fff; width: 0%; transition: width 0.4s ease; }
    #enter-btn {
      margin-top: 28px; padding: 10px 32px; background: transparent; border: 1px solid #fff; color: #fff;
      font-size: 10px; letter-spacing: 4px; text-transform: uppercase; cursor: pointer;
      transition: all 0.2s; border-radius: 2px; font-family: inherit; display: none;
    }
    #enter-btn:hover { background: #fff; color: #000; }

    /* ── SITE ── */
    #site { display: none; width: 100%; height: 100vh; overflow: hidden; }
    #site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 50;
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 32px; background: rgba(0,0,0,0.85); border-bottom: 1px solid #1a1a1a;
    }
    .logo { font-size: 14px; letter-spacing: 4px; text-transform: uppercase; font-weight: bold; }
    .tagline { font-size: 10px; letter-spacing: 2px; color: #555; text-transform: uppercase; margin-top: 4px; }
    .header-hint { font-size: 10px; letter-spacing: 2px; color: #333; text-transform: uppercase; }

    #lair { width: 100%; height: 100vh; background: #0d0d0d; position: relative; overflow: hidden; padding-top: 60px; }
    .lair-scene { width: 100%; height: calc(100vh - 60px); position: relative; }

    .lair-zone {
      position: absolute; cursor: pointer; border: 1px solid rgba(255,255,255,0.06);
      border-radius: 8px; transition: all 0.25s ease;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding-bottom: 8px;
    }
    .lair-zone:hover { border-color: rgba(255,255,255,0.2); }
    .lair-zone:hover .zone-label { opacity: 1; }
    .zone-label {
      font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #fff;
      opacity: 0; transition: opacity 0.2s; text-align: center; line-height: 1.6;
    }
    .zone-link { font-size: 8px; color: #888; letter-spacing: 2px; }

    #tooltip {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12);
      padding: 10px 24px; border-radius: 4px; font-size: 11px; letter-spacing: 2px;
      text-transform: uppercase; pointer-events: none; opacity: 0; transition: opacity 0.3s; color: #fff;
      white-space: nowrap;
    }
    .click-ripple {
      position: fixed; border-radius: 50%; background: rgba(255,255,255,0.15);
      pointer-events: none; animation: ripple 0.6s ease-out forwards;
    }
    @keyframes ripple {
      from { width: 0; height: 0; opacity: 1; transform: translate(-50%,-50%); }
      to { width: 100px; height: 100px; opacity: 0; transform: translate(-50%,-50%); }
    }
    .figure-anim { animation: float 3s ease-in-out infinite; }
    @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
  </style>
</head>
<body>

<!-- ════════════════════════════════════════
     PRELOADER
════════════════════════════════════════ -->
<div id="preloader">
  <svg width="80" height="120" viewBox="0 0 80 120">
    <g transform="translate(40,20)">
      <circle cx="0" cy="0" r="10" fill="none" stroke="#fff" stroke-width="2"/>
      <line x1="0" y1="10" x2="0" y2="55" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="25" x2="-18" y2="40" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="25" x2="18" y2="40" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="55" x2="-16" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
      <line x1="0" y1="55" x2="16" y2="80" stroke="#fff" stroke-width="2" stroke-linecap="round"/>

      <!-- Game controller -->
      <g id="prop-controller" opacity="0">
        <rect x="8" y="32" width="20" height="12" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/>
        <circle cx="11" cy="38" r="1.5" fill="#fff"/>
        <circle cx="25" cy="36" r="1.5" fill="#fff"/>
      </g>
      <!-- Basketball -->
      <g id="prop-ball" opacity="0">
        <circle cx="22" cy="28" r="7" fill="none" stroke="#fff" stroke-width="1.5"/>
        <path d="M16 26 Q22 20 28 26" fill="none" stroke="#fff" stroke-width="1"/>
      </g>
      <!-- Football -->
      <g id="prop-football" opacity="0">
        <ellipse cx="20" cy="22" rx="9" ry="6" fill="none" stroke="#fff" stroke-width="1.5" transform="rotate(-30,20,22)"/>
      </g>
      <!-- Fist (fighting) -->
      <g id="prop-fist" opacity="0">
        <rect x="14" y="18" width="12" height="10" rx="4" fill="none" stroke="#fff" stroke-width="1.5"/>
      </g>
      <!-- Microphone (podcasting) -->
      <g id="prop-mic" opacity="0">
        <rect x="14" y="22" width="8" height="14" rx="4" fill="none" stroke="#fff" stroke-width="1.5"/>
        <line x1="18" y1="36" x2="18" y2="44" stroke="#fff" stroke-width="1.5"/>
        <line x1="12" y1="44" x2="24" y2="44" stroke="#fff" stroke-width="1.5"/>
      </g>
      <!-- Movie screen -->
      <g id="prop-movie" opacity="0">
        <rect x="-28" y="14" width="20" height="16" rx="2" fill="none" stroke="#fff" stroke-width="1.5"/>
        <polygon points="-13,22 -7,18 -7,26" fill="#fff"/>
      </g>
      <!-- Phone (social media) -->
      <g id="prop-phone" opacity="0">
        <rect x="10" y="18" width="12" height="20" rx="3" fill="none" stroke="#fff" stroke-width="1.5"/>
        <circle cx="16" cy="35" r="1.5" fill="#fff"/>
        <rect x="13" y="21" width="6" height="4" rx="1" fill="none" stroke="#fff" stroke-width="1"/>
      </g>
      <!-- Sword -->
      <g id="prop-sword" opacity="0">
        <line x1="10" y1="14" x2="28" y2="42" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
        <line x1="8" y1="30" x2="22" y2="26" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="10" cy="14" r="2" fill="#fff"/>
      </g>
    </g>
  </svg>

  <p id="activity-label">Loading...</p>
  <div id="progress-bar"><div id="progress-fill"></div></div>
  <h1>PoserTryHard</h1>
  <p class="sub">Multimedia Collective</p>
  <button id="enter-btn">Enter the Lair</button>
</div>

<!-- ════════════════════════════════════════
     MAIN SITE
════════════════════════════════════════ -->
<div id="site">
  <div id="site-header">
    <div>
      <div class="logo">PoserTryHard</div>
      <div class="tagline">Multimedia Collective</div>
    </div>
    <div class="header-hint">Hover each zone · Click to visit</div>
  </div>
  <div id="lair">
    <div class="lair-scene" id="scene"></div>
  </div>
  <div id="tooltip"></div>
</div>

<script>
// ════════════════════════════════════════
//  YOUR LINKS — update these!
// ════════════════════════════════════════
const LINKS = {
  social:   'https://linktr.ee/YOURHANDLE',   // ← paste your Linktree or social link
  youtube:  'https://youtube.com/@YOURCHANNEL',
  twitch:   'https://twitch.tv/YOURCHANNEL',
  spotify:  'https://open.spotify.com/show/YOURID',
  patreon:  'https://patreon.com/YOURPAGE',
  shopify:  'https://YOURSTORE.myshopify.com',
};

// ════════════════════════════════════════
//  PRELOADER ANIMATION
// ════════════════════════════════════════
const activities = [
  { label: 'Gaming',      prop: 'controller' },
  { label: 'Balling',     prop: 'ball'       },
  { label: 'Throwing',    prop: 'football'   },
  { label: 'Fighting',    prop: 'fist'       },
  { label: 'Podcasting',  prop: 'mic'        },
  { label: 'Watching',    prop: 'movie'      },
  { label: 'Posting',     prop: 'phone'      },
  { label: 'Armed',       prop: 'sword'      },
];

const fill     = document.getElementById('progress-fill');
const lbl      = document.getElementById('activity-label');
const enterBtn = document.getElementById('enter-btn');
let step = 0;

function setProp(name) {
  ['controller','ball','football','fist','mic','movie','phone','sword'].forEach(p => {
    document.getElementById('prop-' + p).setAttribute('opacity', p === name ? '1' : '0');
  });
}

function animateStep(i) {
  const a = activities[i];
  lbl.style.opacity = '0';
  setTimeout(() => { lbl.textContent = a.label; lbl.style.opacity = '1'; setProp(a.prop); }, 150);
}

animateStep(0);
let progress = 0;
const interval = setInterval(() => {
  step = (step + 1) % activities.length;
  progress = Math.min(100, progress + (100 / activities.length));
  fill.style.width = progress + '%';
  animateStep(step);
  if (progress >= 100) {
    clearInterval(interval);
    setTimeout(() => { lbl.textContent = 'Ready.'; enterBtn.style.display = 'inline-block'; setProp(''); }, 500);
  }
}, 900);

enterBtn.addEventListener('click', () => {
  document.getElementById('preloader').style.opacity = '0';
  setTimeout(() => {
    document.getElementById('preloader').style.display = 'none';
    document.getElementById('site').style.display = 'block';
    buildLair();
  }, 800);
});

// ════════════════════════════════════════
//  LAIR BUILDER
// ════════════════════════════════════════
function makeZone(zone, W, H) {
  const el = document.createElement('div');
  el.className = 'lair-zone';
  el.style.left   = Math.round(zone.x * W) + 'px';
  el.style.top    = Math.round(zone.y * H) + 'px';
  el.style.width  = Math.round(zone.w * W) + 'px';
  el.style.height = Math.round(zone.h * H) + 'px';
  el.style.background = zone.bg;

  const zW = Math.round(zone.w * W);
  const zH = Math.round(zone.h * H);
  el.innerHTML = zone.draw(zW, zH, zone.glow) +
    `<div class="zone-label">${zone.label}<br><span class="zone-link">↗ ${zone.dest}</span></div>`;

  el.addEventListener('mouseenter', () => {
    document.getElementById('tooltip').style.opacity = '1';
    document.getElementById('tooltip').textContent = '↗ Visit ' + zone.dest;
    el.style.borderColor = zone.glow + '55';
    el.style.boxShadow = `inset 0 0 40px ${zone.glow}11, 0 0 20px ${zone.glow}22`;
  });
  el.addEventListener('mouseleave', () => {
    document.getElementById('tooltip').style.opacity = '0';
    el.style.borderColor = 'rgba(255,255,255,0.06)';
    el.style.boxShadow = 'none';
  });
  el.addEventListener('click', e => {
    const r = document.createElement('div');
    r.className = 'click-ripple';
    r.style.left = e.clientX + 'px';
    r.style.top  = e.clientY + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 700);
    setTimeout(() => window.open(zone.url, '_blank'), 300);
  });
  return el;
}

function buildLair() {
  const scene = document.getElementById('scene');
  const W = window.innerWidth;
  const H = window.innerHeight - 60;

  const zones = [
    {
      label: 'Command Deck', dest: 'Social Media', url: LINKS.social,
      x:0.00, y:0.04, w:0.24, h:0.60, bg:'#0a1a2e', glow:'#1a6fff',
      draw(w,h,g) {
        const ih = h - 36;
        return `<svg width="${w}" height="${ih}" viewBox="0 0 ${w} ${ih}">
          <rect x="8" y="8" width="${w-16}" height="${ih*0.5}" rx="4" fill="${g}0a" stroke="${g}66" stroke-width="1"/>
          <rect x="12" y="12" width="${w-24}" height="${ih*0.44}" rx="2" fill="${g}11"/>
          <line x1="${w*0.25}" y1="${ih*0.52}" x2="${w*0.25}" y2="${ih*0.64}" stroke="${g}55" stroke-width="1"/>
          <line x1="${w*0.75}" y1="${ih*0.52}" x2="${w*0.75}" y2="${ih*0.64}" stroke="${g}55" stroke-width="1"/>
          <rect x="${w*0.1}" y="${ih*0.64}" width="${w*0.8}" height="5" rx="2" fill="${g}44"/>
          ${[0,1,2].map(i=>`<rect x="${14+i*(w-28)/3+3}" y="${18+i*5}" width="${(w-28)/3-7}" height="3" rx="1" fill="${g}55"/>`).join('')}
          <text x="${w/2}" y="${ih*0.82}" text-anchor="middle" fill="${g}88" font-size="9" font-family="Arial" letter-spacing="3">SOCIAL</text>
          ${Array.from({length:5},(_,i)=>`<circle cx="${14+i*(w-24)/4}" cy="${ih*0.92}" r="2" fill="${g}${i<3?'bb':'33'}"/>`).join('')}
        </svg>`;
      }
    },
    {
      label: 'The Theater', dest: 'YouTube', url: LINKS.youtube,
      x:0.25, y:0.04, w:0.19, h:0.44, bg:'#1a0a0a', glow:'#ff2020',
      draw(w,h,g) {
        const ih = h - 36;
        return `<svg width="${w}" height="${ih}" viewBox="0 0 ${w} ${ih}">
          <rect x="8" y="8" width="${w-16}" height="${ih*0.62}" rx="4" fill="${g}0a" stroke="${g}66" stroke-width="1"/>
          <polygon points="${w*0.32},${ih*0.18} ${w*0.78},${ih*0.39} ${w*0.32},${ih*0.60}" fill="${g}99"/>
          <line x1="8" y1="${ih*0.74}" x2="${w-8}" y2="${ih*0.74}" stroke="${g}33" stroke-width="0.5"/>
          <text x="${w/2}" y="${ih*0.88}" text-anchor="middle" fill="${g}88" font-size="9" font-family="Arial" letter-spacing="2">YOUTUBE</text>
        </svg>`;
      }
    },
    {
      label: 'Stream Cave', dest: 'Twitch', url: LINKS.twitch,
      x:0.45, y:0.04, w:0.18, h:0.44, bg:'#0f0a1a', glow:'#9147ff',
      draw(w,h,g) {
        const ih = h - 36;
        return `<svg width="${w}" height="${ih}" viewBox="0 0 ${w} ${ih}">
          <rect x="8" y="8" width="${w-16}" height="${ih*0.55}" rx="4" fill="${g}0a" stroke="${g}66" stroke-width="1"/>
          <circle cx="${w-17}" cy="17" r="4" fill="#ff0000"/>
          <rect x="13" y="15" width="${w*0.42}" height="3" rx="1" fill="${g}55"/>
          <rect x="13" y="21" width="${w*0.55}" height="2" rx="1" fill="${g}33"/>
          ${Array.from({length:4},(_,i)=>`<rect x="13" y="${30+i*7}" width="${w-24}" height="4" rx="1" fill="${g}22"/>`).join('')}
          <text x="${w/2}" y="${ih*0.88}" text-anchor="middle" fill="${g}88" font-size="9" font-family="Arial" letter-spacing="2">TWITCH</text>
        </svg>`;
      }
    },
    {
      label: 'The Gym', dest: 'Spotify', url: LINKS.spotify,
      x:0.64, y:0.04, w:0.18, h:0.44, bg:'#0a1a0a', glow:'#1db954',
      draw(w,h,g) {
        const ih = h - 36;
        return `<svg width="${w}" height="${ih}" viewBox="0 0 ${w} ${ih}">
          <line x1="${w*0.14}" y1="${ih*0.36}" x2="${w*0.86}" y2="${ih*0.36}" stroke="${g}88" stroke-width="3" stroke-linecap="round"/>
          <rect x="${w*0.07}" y="${ih*0.22}" width="${w*0.1}" height="${ih*0.28}" rx="4" fill="${g}66"/>
          <rect x="${w*0.03}" y="${ih*0.27}" width="${w*0.08}" height="${ih*0.18}" rx="3" fill="${g}44"/>
          <rect x="${w*0.83}" y="${ih*0.22}" width="${w*0.1}" height="${ih*0.28}" rx="4" fill="${g}66"/>
          <rect x="${w*0.89}" y="${ih*0.27}" width="${w*0.08}" height="${ih*0.18}" rx="3" fill="${g}44"/>
          <circle cx="${w/2}" cy="${ih*0.36}" r="9" fill="none" stroke="${g}55" stroke-width="1.5"/>
          <text x="${w/2}" y="${ih*0.88}" text-anchor="middle" fill="${g}88" font-size="9" font-family="Arial" letter-spacing="2">SPOTIFY</text>
        </svg>`;
      }
    },
    {
      label: 'Weapons Rack', dest: 'Patreon', url: LINKS.patreon,
      x:0.83, y:0.04, w:0.17, h:0.90, bg:'#1a0e0a', glow:'#ff424d',
      draw(w,h,g) {
        const ih = h - 36;
        const cx = w / 2;
        return `<svg width="${w}" height="${ih}" viewBox="0 0 ${w} ${ih}">
          <line x1="${w*0.15}" y1="${ih*0.06}" x2="${w*0.85}" y2="${ih*0.06}" stroke="${g}66" stroke-width="2" stroke-linecap="round"/>
          <line x1="${w*0.15}" y1="${ih*0.95}" x2="${w*0.85}" y2="${ih*0.95}" stroke="${g}44" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="${w*0.2}"  y1="${ih*0.06}" x2="${w*0.2}"  y2="${ih*0.95}" stroke="${g}33" stroke-width="1"/>
          <line x1="${w*0.8}"  y1="${ih*0.06}" x2="${w*0.8}"  y2="${ih*0.95}" stroke="${g}33" stroke-width="1"/>
          <!-- Sword -->
          <line x1="${cx-4}" y1="${ih*0.10}" x2="${cx-4}" y2="${ih*0.50}" stroke="${g}cc" stroke-width="2.5" stroke-linecap="round"/>
          <polygon points="${cx-4},${ih*0.09} ${cx-8},${ih*0.16} ${cx},${ih*0.16}" fill="${g}cc"/>
          <rect x="${cx-9}" y="${ih*0.44}" width="10" height="5" rx="1" fill="${g}88"/>
          <!-- Spear -->
          <line x1="${cx+10}" y1="${ih*0.12}" x2="${cx+10}" y2="${ih*0.48}" stroke="${g}aa" stroke-width="2" stroke-linecap="round"/>
          <ellipse cx="${cx+10}" cy="${ih*0.10}" rx="4" ry="6" fill="none" stroke="${g}aa" stroke-width="1.5"/>
          <line x1="${cx+5}"  y1="${ih*0.32}" x2="${cx+15}" y2="${ih*0.32}" stroke="${g}66" stroke-width="1.5"/>
          <!-- Axe -->
          <line x1="${cx-12}" y1="${ih*0.55}" x2="${cx+4}"  y2="${ih*0.88}" stroke="${g}bb" stroke-width="2.5" stroke-linecap="round"/>
          <path d="M${cx-12},${ih*0.55} L${cx-18},${ih*0.59} L${cx-15},${ih*0.64} Z" fill="${g}99"/>
          <rect x="${cx-8}" y="${ih*0.82}" width="8" height="5" rx="1" fill="${g}77"/>
          <!-- Scimitar -->
          <path d="M${cx+14},${ih*0.56} C${cx+14},${ih*0.56} ${cx+20},${ih*0.62} ${cx+18},${ih*0.70} C${cx+16},${ih*0.78} ${cx+8},${ih*0.76} ${cx+8},${ih*0.84} C${cx+8},${ih*0.90} ${cx+14},${ih*0.92} ${cx+14},${ih*0.92}" fill="none" stroke="${g}99" stroke-width="2" stroke-linecap="round"/>
          <line x1="${cx+10}" y1="${ih*0.54}" x2="${cx+18}" y2="${ih*0.58}" stroke="${g}88" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Divider -->
          <line x1="${w*0.15}" y1="${ih*0.34}" x2="${w*0.85}" y2="${ih*0.34}" stroke="${g}33" stroke-width="0.5" stroke-dasharray="3,3"/>
          <text x="${cx}" y="${ih*0.97}" text-anchor="middle" fill="${g}88" font-size="8" font-family="Arial" letter-spacing="2">PATREON</text>
        </svg>`;
      }
    },
    {
      label: 'The Garage', dest: 'Shopify', url: LINKS.shopify,
      x:0.25, y:0.49, w:0.57, h:0.45, bg:'#111108', glow:'#f5a623',
      draw(w,h,g) {
        const ih = h - 36;
        return `<svg width="${w}" height="${ih}" viewBox="0 0 ${w} ${ih}">
          <rect x="${w*0.07}" y="${ih*0.38}" width="${w*0.86}" height="${ih*0.34}" rx="6" fill="${g}11" stroke="${g}66" stroke-width="1"/>
          <path d="M${w*0.17},${ih*0.38} L${w*0.28},${ih*0.16} L${w*0.72},${ih*0.16} L${w*0.83},${ih*0.38}" fill="${g}22" stroke="${g}55" stroke-width="1"/>
          <rect x="${w*0.32}" y="${ih*0.18}" width="${w*0.36}" height="${ih*0.17}" rx="3" fill="${g}22"/>
          <circle cx="${w*0.21}" cy="${ih*0.74}" r="${ih*0.10}" fill="${g}11" stroke="${g}66" stroke-width="1.5"/>
          <circle cx="${w*0.21}" cy="${ih*0.74}" r="${ih*0.05}" fill="${g}44"/>
          <circle cx="${w*0.79}" cy="${ih*0.74}" r="${ih*0.10}" fill="${g}11" stroke="${g}66" stroke-width="1.5"/>
          <circle cx="${w*0.79}" cy="${ih*0.74}" r="${ih*0.05}" fill="${g}44"/>
          <rect x="${w*0.10}" y="${ih*0.42}" width="${w*0.14}" height="${ih*0.09}" rx="2" fill="${g}55"/>
          <rect x="${w*0.76}" y="${ih*0.42}" width="${w*0.14}" height="${ih*0.09}" rx="2" fill="${g}55"/>
          <text x="${w/2}" y="${ih*0.92}" text-anchor="middle" fill="${g}88" font-size="9" font-family="Arial" letter-spacing="2">SHOPIFY</text>
        </svg>`;
      }
    },
  ];

  zones.forEach(z => scene.appendChild(makeZone(z, W, H)));

  // Floating ghost figure in the center
  const ghost = document.createElement('div');
  ghost.className = 'figure-anim';
  ghost.style.cssText = `position:absolute;left:${W*0.39}px;top:${H*0.28}px;opacity:0.10;pointer-events:none;`;
  ghost.innerHTML = `<svg width="44" height="64" viewBox="0 0 44 64">
