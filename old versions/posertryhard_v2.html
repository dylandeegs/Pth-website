<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PoserTryHard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif;color:#fff;}
#preloader{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:200;
}
#stage{position:relative;width:220px;height:260px;display:flex;align-items:center;justify-content:center;}
#figure-img{position:absolute;width:140px;height:160px;object-fit:contain;filter:invert(1);}
#logo-img{position:absolute;width:90px;height:165px;object-fit:contain;opacity:0;filter:invert(1);transition:opacity 0.06s linear;}
#acc-canvas{position:absolute;top:0;left:0;width:220px;height:260px;pointer-events:none;}
#preloader-title{margin-top:16px;font-size:11px;letter-spacing:5px;text-transform:uppercase;color:#fff;opacity:0.5;}
#activity-name{margin-top:8px;font-size:10px;letter-spacing:4px;text-transform:uppercase;color:#fff;min-height:16px;transition:opacity 0.08s;}
#progress-wrap{width:180px;height:2px;background:#222;margin-top:14px;border-radius:2px;overflow:hidden;}
#progress-bar{height:100%;background:#fff;width:0%;transition:width 0.1s linear;}
#enter-btn{display:none;margin-top:22px;padding:10px 32px;background:transparent;border:1px solid #fff;color:#fff;font-size:10px;letter-spacing:4px;text-transform:uppercase;cursor:pointer;border-radius:2px;font-family:inherit;transition:all 0.2s;}
#enter-btn:hover{background:#fff;color:#000;}
#site{display:none;width:100%;height:100vh;position:relative;overflow:hidden;}
#site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:rgba(0,0,0,0.9);border-bottom:1px solid #1a1a1a;}
.logo-text{font-size:13px;letter-spacing:4px;text-transform:uppercase;font-weight:bold;}
.tagline{font-size:9px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-top:3px;}
.hint{font-size:9px;letter-spacing:2px;color:#333;text-transform:uppercase;}
#lair-container{position:absolute;top:48px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
#lair-img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
#lair-overlay{position:absolute;top:0;left:0;pointer-events:none;}
.zone{position:absolute;cursor:pointer;pointer-events:all;border:1px solid transparent;border-radius:6px;transition:all 0.2s ease;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;}
.zone:hover{border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.05);}
.zone-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:0;transition:opacity 0.2s;text-align:center;line-height:1.7;text-shadow:0 0 10px #000,0 0 20px #000,0 0 4px #000;}
.zone:hover .zone-label{opacity:1;}
.zone-sub{font-size:7px;color:#bbb;letter-spacing:2px;display:block;}
#tooltip{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.15);padding:8px 20px;border-radius:4px;font-size:10px;letter-spacing:2px;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity 0.25s;color:#fff;white-space:nowrap;}
.ripple{position:fixed;border-radius:50%;background:rgba(255,255,255,0.2);pointer-events:none;animation:rpl 0.55s ease-out forwards;transform:translate(-50%,-50%);}
@keyframes rpl{from{width:0;height:0;opacity:1;}to{width:90px;height:90px;opacity:0;}}
</style>
</head>

<script>
var LINKS = {
  social:  'https://linktr.ee/YOURHANDLE',
  youtube: 'https://youtube.com/@YOURCHANNEL',
  twitch:  'https://twitch.tv/YOURCHANNEL',
  spotify: 'https://open.spotify.com/show/YOURID',
  patreon: 'https://patreon.com/YOURPAGE',
  shopify: 'https://YOURSTORE.myshopify.com'
};

var canvas   = document.getElementById('acc-canvas');
var ctx      = canvas.getContext('2d');
var figImg   = document.getElementById('figure-img');
var logoImg  = document.getElementById('logo-img');
var actName  = document.getElementById('activity-name');
var bar      = document.getElementById('progress-bar');
var enterBtn = document.getElementById('enter-btn');

var CX=110, CY=130;

function ln(x1,y1,x2,y2,col,w){
  ctx.save();ctx.strokeStyle=col||'#fff';ctx.lineWidth=w||2;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.restore();
}
function circ(x,y,r,fill,stroke,sw){
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw||2;ctx.stroke();}
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function glove(x,y,ang){
  ctx.save();ctx.translate(x,y);ctx.rotate(ang);
  rr(-11,-8,22,16,7);ctx.fillStyle='rgba(255,255,255,0.15)';ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();ctx.restore();
}

var acts=[
  {name:'Gaming',draw:function(t){
    var b=Math.sin(t*4)*3;
    ln(CX-12,CY-15,CX-24,CY+18+b);ln(CX+12,CY-15,CX+24,CY+18+b);
    rr(CX-24,CY+18+b,48,30,7);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(CX-20,CY+27+b,6,14);ctx.fillRect(CX-23,CY+31+b,12,6);
    circ(CX+12,CY+26+b,3,'#fff');circ(CX+19,CY+33+b,3,'#fff');circ(CX+12,CY+40+b,3,'#fff');
  }},
  {name:'Shooting',draw:function(t){
    ln(CX+10,CY-18,CX+55,CY-30,'#fff',2.5);
    ctx.save();ctx.translate(CX+55,CY-30);ctx.rotate(-0.12);
    rr(-6,-6,32,12,4);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(22,-4,18,8);
    rr(0,5,12,16,3);ctx.fillStyle='rgba(255,255,255,0.2)';ctx.fill();ctx.strokeStyle='#fff';ctx.stroke();
    ctx.restore();
    ln(CX-10,CY-18,CX-28,CY+2,'#fff',2.5);
    if(Math.sin(t*9)>0.3){circ(CX+85,CY-36,9,'rgba(255,240,80,0.85)');}
  }},
  {name:'Basketball',draw:function(t){
    var b=Math.abs(Math.sin(t*5))*44;
    ln(CX+10,CY-20,CX+38,CY-48,'#fff',2.5);
    circ(CX+60,CY-72+b,20,null,'#fff',2);
    ctx.beginPath();ctx.arc(CX+60,CY-72+b,20,-0.4,Math.PI+0.4);ctx.strokeStyle='#fff';ctx.lineWidth=1.5;ctx.stroke();
    ln(CX+60,CY-92+b,CX+60,CY-52+b,'#fff',1.2);
    ln(CX-10,CY-18,CX-26,CY+4,'#fff',2.5);
  }},
  {name:'Skateboarding',draw:function(t){
    var lean=Math.sin(t*2)*5;
    ln(CX-10,CY-15,CX-48,CY-6+lean,'#fff',2.5);
    ln(CX+10,CY-15,CX+48,CY-6-lean,'#fff',2.5);
    rr(CX-38,CY+38,76,10,5);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    circ(CX-26,CY+52,7,null,'#fff',2);circ(CX+26,CY+52,7,null,'#fff',2);
  }},
  {name:'Throwing',draw:function(t){
    var sw=Math.sin(t*3)*22;
    ln(CX+10,CY-18,CX+50-sw,CY-45+sw*0.3,'#fff',2.5);
    ctx.save();ctx.translate(CX+54-sw,CY-52+sw*0.3);ctx.rotate(-0.5+sw*0.02);
    ctx.beginPath();ctx.ellipse(0,0,15,9,0,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ln(-10,0,10,0,'#fff',1.2);ctx.restore();
    ln(CX-10,CY-18,CX-28,CY+4,'#fff',2.5);
  }},
  {name:'Podcasting',draw:function(t){
    var p=1+Math.sin(t*6)*0.06;
    ln(CX-8,CY-18,CX-30,CY-44,'#fff',2.5);
    ctx.save();ctx.translate(CX-30,CY-62);
    rr(-9,-20,18,30,9);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ln(0,10,0,26,'#fff',2);ln(-10,26,10,26,'#fff',2);ctx.restore();
    ctx.save();ctx.translate(CX,CY-105);
    ctx.beginPath();ctx.arc(0,0,20,Math.PI,0,false);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    circ(-20,0,8,null,'#fff',3);circ(20,0,8,null,'#fff',3);ctx.restore();
    for(var i=1;i<=3;i++){
      ctx.beginPath();ctx.arc(CX-30,CY-62,i*9*p,-2.2,0.2);
      ctx.strokeStyle='rgba(255,255,255,'+(0.45-i*0.12)+')';ctx.lineWidth=1.5;ctx.stroke();
    }
    ln(CX+10,CY-18,CX+28,CY+4,'#fff',2.5);
  }},
  {name:'Watching',draw:function(t){
    rr(CX-85,CY-95,170,96,6);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    var gl=0.04+Math.abs(Math.sin(t*1.5))*0.09;
    ctx.fillStyle='rgba(80,140,255,'+gl+')';ctx.fillRect(CX-81,CY-91,162,88);
    rr(CX-52,CY+28,104,22,5);ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fill();ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    rr(CX-56,CY+16,18,38,5);ctx.stroke();rr(CX+38,CY+16,18,38,5);ctx.stroke();
    ln(CX-10,CY+14,CX-22,CY+32,'#fff',2.5);ln(CX+10,CY+14,CX+22,CY+32,'#fff',2.5);
  }},
  {name:'Fighting',draw:function(t){
    var ph=(t*2.5)%3;
    if(ph<1){
      ln(CX-10,CY-18,CX-58,CY-28,'#fff',2.5);glove(CX-58,CY-28,-0.3);
      ln(CX+10,CY-18,CX+32,CY+2,'#fff',2.5);glove(CX+32,CY+2,0.2);
    }else if(ph<2){
      ln(CX+10,CY-18,CX+58,CY-24,'#fff',2.5);glove(CX+58,CY-24,0.3);
      ln(CX-10,CY-18,CX-32,CY+2,'#fff',2.5);glove(CX-32,CY+2,-0.2);
    }else{
      ln(CX+8,CY+12,CX+58,CY-4,'#fff',2.5);glove(CX+58,CY-4,0.1);
      ln(CX-8,CY+12,CX-24,CY+46,'#fff',2.5);
      ln(CX-10,CY-18,CX-30,CY-34,'#fff',2.5);glove(CX-30,CY-34,-0.4);
    }
  }},
  {name:'DJing',draw:function(t){
    circ(CX-50,CY+18,22,null,'#fff',2);circ(CX-50,CY+18,5,'#fff');
    circ(CX+50,CY+18,22,null,'#fff',2);circ(CX+50,CY+18,5,'#fff');
    var a=t*4;
    ln(CX-50,CY+18,CX-50+Math.cos(a)*20,CY+18+Math.sin(a)*20,'#fff',1.5);
    ln(CX+50,CY+18,CX+50+Math.cos(-a)*20,CY+18+Math.sin(-a)*20,'#fff',1.5);
    rr(CX-20,CY+5,40,26,4);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillRect(CX-5+Math.sin(t)*9,CY+18,10,7);
    ln(CX-10,CY-15,CX-38,CY+2,'#fff',2.5);ln(CX+10,CY-15,CX+38,CY+2,'#fff',2.5);
    ctx.save();ctx.translate(CX,CY-100);
    ctx.beginPath();ctx.arc(0,0,18,Math.PI,0,false);ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.stroke();
    circ(-18,0,7,null,'#fff',3);circ(18,0,7,null,'#fff',3);ctx.restore();
    for(var i=0;i<5;i++){var h=6+Math.abs(Math.sin(t*4+i))*22;ctx.fillStyle='rgba(255,255,255,0.55)';ctx.fillRect(CX-58+i*30,CY-65-h,8,h);}
  }},
  {name:'Texting',draw:function(t){
    var b=Math.sin(t*5)*2;
    ln(CX-10,CY-15,CX-20,CY+22+b,'#fff',2.5);ln(CX+10,CY-15,CX+20,CY+22+b,'#fff',2.5);
    rr(CX-18,CY+18+b,36,52,6);ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle='rgba(255,255,255,0.08)';ctx.fillRect(CX-14,CY+22+b,28,38);
    if(Math.sin(t*7)>0){ctx.fillStyle='#fff';ctx.fillRect(CX-1,CY+50+b,2,7);}
    ctx.save();ctx.translate(CX+34,CY-44);
    rr(0,-16,40,22,5);ctx.fillStyle='rgba(255,255,255,0.1)';ctx.fill();ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.stroke();
    for(var i=0;i<3;i++) circ(10+i*10,0,2,'#fff');
    ctx.beginPath();ctx.moveTo(4,6);ctx.lineTo(-5,14);ctx.lineTo(12,6);ctx.strokeStyle='rgba(255,255,255,0.5)';ctx.lineWidth=1.5;ctx.stroke();
    ctx.restore();
  }}
];

var step=0,frames=0,morphA=0,phase='acts',holdF=0;
var FPP=55;
var animId;

function tick(){
  frames++;
  var t=frames*0.05;
  ctx.clearRect(0,0,220,260);

  if(phase==='acts'){
    var idx=Math.floor(frames/FPP)%acts.length;
    if(idx!==step){
      step=idx;
      actName.style.opacity='0';
      setTimeout(function(){actName.textContent=acts[step].name;actName.style.opacity='1';},70);
    }
    bar.style.width=Math.min((frames/(acts.length*FPP))*100,100)+'%';
    figImg.style.opacity='1';logoImg.style.opacity='0';
    acts[step].draw(t);
    if(frames>=acts.length*FPP){phase='to-logo';}
  }
  else if(phase==='to-logo'){
    morphA=Math.min(morphA+0.03,1);
    figImg.style.opacity=(1-morphA).toFixed(3);
    logoImg.style.opacity=morphA.toFixed(3);
    if(morphA>=1){phase='hold';holdF=0;}
  }
  else if(phase==='hold'){
    holdF++;
    if(holdF>70){phase='to-man';}
  }
  else if(phase==='to-man'){
    morphA=Math.max(morphA-0.03,0);
    figImg.style.opacity=(1-morphA).toFixed(3);
    logoImg.style.opacity=morphA.toFixed(3);
    if(morphA<=0){phase='done';}
  }
  else if(phase==='done'){
    cancelAnimationFrame(animId);
    figImg.style.opacity='1';logoImg.style.opacity='0';
    actName.style.opacity='0';
    setTimeout(function(){actName.textContent='Ready.';actName.style.opacity='1';},80);
    bar.style.width='100%';
    enterBtn.style.display='inline-block';
    return;
  }
  animId=requestAnimationFrame(tick);
}
animId=requestAnimationFrame(tick);
actName.textContent=acts[0].name;

enterBtn.addEventListener('click',function(){
  var pre=document.getElementById('preloader');
  pre.style.transition='opacity 0.7s';pre.style.opacity='0';
  setTimeout(function(){
    pre.style.display='none';
    document.getElementById('site').style.display='block';
    setupLair();
  },700);
});

function setupLair(){
  var img=document.getElementById('lair-img');
  var overlay=document.getElementById('lair-overlay');
  var container=document.getElementById('lair-container');
  var zoneDefs=[
    {id:'z-patreon', l:0.01,t:0.04,w:0.12,h:0.60, url:LINKS.patreon},
    {id:'z-spotify', l:0.13,t:0.38,w:0.16,h:0.58, url:LINKS.spotify},
    {id:'z-social',  l:0.30,t:0.04,w:0.22,h:0.60, url:LINKS.social},
    {id:'z-shopify', l:0.26,t:0.56,w:0.48,h:0.40, url:LINKS.shopify},
    {id:'z-youtube', l:0.52,t:0.04,w:0.14,h:0.52, url:LINKS.youtube},
    {id:'z-twitch',  l:0.66,t:0.04,w:0.15,h:0.52, url:LINKS.twitch},
    {id:'z-patreon2',l:0.82,t:0.04,w:0.17,h:0.90, url:LINKS.patreon}
  ];
  zoneDefs.forEach(function(z){
    var el=document.getElementById(z.id);
    el.addEventListener('click',function(e){goTo(z.url,e);});
  });

  function layout(){
    var r=img.getBoundingClientRect();
    var cr=container.getBoundingClientRect();
    var ox=r.left-cr.left, oy=r.top-cr.top;
    var iw=r.width, ih=r.height;
    overlay.style.width=cr.width+'px';overlay.style.height=cr.height+'px';
    zoneDefs.forEach(function(z){
      var el=document.getElementById(z.id);
      el.style.left=(ox+z.l*iw)+'px';
      el.style.top=(oy+z.t*ih)+'px';
      el.style.width=(z.w*iw)+'px';
      el.style.height=(z.h*ih)+'px';
    });
  }
  if(img.complete&&img.naturalWidth>0) layout();
  else img.addEventListener('load',layout);
  window.addEventListener('resize',layout);
}

function goTo(url,e){
  var rpl=document.createElement('div');rpl.className='ripple';
  rpl.style.left=e.clientX+'px';rpl.style.top=e.clientY+'px';
  document.body.appendChild(rpl);
  setTimeout(function(){rpl.remove();},600);
  setTimeout(function(){window.open(url,'_blank');},200);
}
function tip(name){
  var t=document.getElementById('tooltip');
  t.textContent='\u2197 Visit '+name;t.style.opacity='1';
}
function untip(){document.getElementById('tooltip').style.opacity='0';}
</script>
