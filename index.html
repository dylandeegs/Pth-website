<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>PoserTryHard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif;}
#preloader{position:fixed;inset:0;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;transition:opacity 0.7s ease;}
#video-stage{position:relative;width:360px;height:360px;}
.act-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity 0.06s ease;}
.act-video.active{opacity:1;}
#logo-morph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity 0.05s linear;}
#logo-morph img{height:260px;width:auto;object-fit:contain;}
#stand-man{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;}
#stand-man img{height:280px;width:auto;object-fit:contain;}
#act-label{margin-top:14px;font-size:11px;letter-spacing:6px;text-transform:uppercase;color:#000;min-height:18px;text-align:center;transition:opacity 0.1s;}
#brand-label{margin-top:6px;font-size:10px;letter-spacing:5px;text-transform:uppercase;color:#000;opacity:0.28;}
#entering-label{margin-top:14px;font-size:10px;letter-spacing:6px;text-transform:uppercase;color:#000;opacity:0;transition:opacity 0.7s;}
#site{display:none;width:100%;height:100vh;position:relative;overflow:hidden;}
#site-header{position:fixed;top:0;left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:12px 28px;background:rgba(0,0,0,0.92);border-bottom:1px solid #1a1a1a;}
.logo-text{font-size:13px;letter-spacing:4px;text-transform:uppercase;font-weight:bold;color:#fff;}
.tagline{font-size:9px;letter-spacing:2px;color:#555;text-transform:uppercase;margin-top:3px;}
.hint{font-size:9px;letter-spacing:2px;color:#333;text-transform:uppercase;}
#lair-container{position:absolute;top:48px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;background:#000;overflow:hidden;}
#lair-img{max-width:100%;max-height:100%;object-fit:contain;display:block;}
#lair-overlay{position:absolute;top:0;left:0;pointer-events:none;}
.zone{position:absolute;cursor:pointer;pointer-events:all;border:1px solid transparent;border-radius:6px;transition:all 0.2s ease;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;}
.zone:hover{border-color:rgba(255,255,255,0.25);background:rgba(255,255,255,0.05);}
.zone-label{font-size:8px;letter-spacing:2px;text-transform:uppercase;color:#fff;opacity:0;transition:opacity 0.2s;text-align:center;line-height:1.7;text-shadow:0 0 10px #000,0 0 20px #000;}
.zone:hover .zone-label{opacity:1;}
.zone-sub{font-size:7px;color:#bbb;letter-spacing:2px;display:block;}
#tooltip{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);border:1px solid rgba(255,255,255,0.15);padding:8px 20px;border-radius:4px;font-size:10px;letter-spacing:2px;text-transform:uppercase;pointer-events:none;opacity:0;transition:opacity 0.25s;color:#fff;white-space:nowrap;}
.ripple{position:fixed;border-radius:50%;background:rgba(255,255,255,0.2);pointer-events:none;animation:rpl 0.55s ease-out forwards;transform:translate(-50%,-50%);}
@keyframes rpl{from{width:0;height:0;opacity:1;}to{width:90px;height:90px;opacity:0;}}
/* Hover animations: small clips laid over the lair, edges feathered so they blend in */
.station{position:absolute;pointer-events:none;opacity:0;transition:opacity 0.25s ease;object-fit:fill;
  -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 72%,transparent 100%);
          mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 72%,transparent 100%);}
.station.on{opacity:1;}
</style>
</head>

<script>
var LINKS = {
  youtube:   'https://youtube.com/@YOURCHANNEL',
  spotify:   'https://open.spotify.com/show/YOURID',
  social:    'https://linktr.ee/YOURHANDLE',
  facebook:  'https://facebook.com/YOURPAGE',
  tiktok:    'https://tiktok.com/@YOURHANDLE',
  instagram: 'https://instagram.com/YOURHANDLE',
  twitter:   'https://x.com/YOURHANDLE',
  twitch:    'https://twitch.tv/YOURCHANNEL',
  kick:      'https://kick.com/YOURCHANNEL',
  shopify:   'https://YOURSTORE.myshopify.com',
  patreon:   'https://patreon.com/YOURPAGE'
};

var PLAYBACK_RATE = 6.0;
var CLIP_DURATION = 500;

var videos = [
  {id:"v0", label:"Gaming"},
  {id:"v1", label:"Shooting"},
  {id:"v2", label:"Basketball"},
  {id:"v3", label:"Skateboarding"},
  {id:"v4", label:"Football"},
  {id:"v5", label:"Podcasting"},
  {id:"v6", label:"Watching"},
  {id:"v7", label:"Fighting"},
  {id:"v8", label:"DJing"},
  {id:"v9", label:"Texting"},
]

var actLabel    = document.getElementById('act-label');
var logoMorph   = document.getElementById('logo-morph');
var standMan    = document.getElementById('stand-man');
var enteringLbl = document.getElementById('entering-label');
var preloader   = document.getElementById('preloader');
var current = 0;
var phase = 'loading';

function onVideoLoaded() {
  loaded++;
  if (loaded >= total) { phase='playing'; showStandMan(true); setTimeout(function(){ showStandMan(false); playNext(); }, 400); }
}
var loaded = 0; var total = videos.length;
videos.forEach(function(v,i) {
  var el = document.getElementById(v.id);
  el.playbackRate = PLAYBACK_RATE;
  el.addEventListener('canplaythrough', onVideoLoaded, {once:true});
  if (el.readyState >= 3) onVideoLoaded();
});

function showStandMan(show) { standMan.style.opacity = show ? '1' : '0'; }
function setLabel(txt) { actLabel.style.opacity='0'; setTimeout(function(){ actLabel.textContent=txt; actLabel.style.opacity=txt?'1':'0'; },80); }
function hideAll() { document.querySelectorAll('.act-video').forEach(function(v){ v.classList.remove('active'); v.pause(); v.currentTime=0; }); }

function playNext() {
  if (current >= videos.length) { morphToLogo(); return; }
  var v = videos[current]; var el = document.getElementById(v.id);
  hideAll(); el.classList.add('active'); el.currentTime=0; el.playbackRate=PLAYBACK_RATE; el.play();
  setLabel(v.label); current++;
  setTimeout(playNext, CLIP_DURATION);
}

function morphToLogo() {
  hideAll(); setLabel(''); showStandMan(false);
  var a=0; var t=setInterval(function(){ a=Math.min(a+0.05,1); logoMorph.style.opacity=a; if(a>=1){clearInterval(t);setTimeout(morphBack,1000);} },30);
}
function morphBack() {
  var a=1; var t=setInterval(function(){ a=Math.max(a-0.05,0); logoMorph.style.opacity=a; if(a<=0){clearInterval(t);showStandMan(true);setTimeout(enterLair,700);} },30);
}
function enterLair() {
  enteringLbl.style.opacity='1';
  setTimeout(function(){
    preloader.style.opacity='0';
    setTimeout(function(){ preloader.style.display='none'; document.getElementById('site').style.display='block'; setupLair(); },800);
  },1400);
}

function setupLair(){
  var img=document.getElementById('lair-img');
  var overlay=document.getElementById('lair-overlay');
  var container=document.getElementById('lair-container');

  // Zone definitions as % of lair image dimensions
  // Positions set by Dylan in the Lair Zone Editor (Oct 29, 2026)
  var zoneDefs = [
    {id:'z-youtube',   l:0.01, t:0.2157, w:0.1545, h:0.5199, url:LINKS.youtube},
    {id:'z-spotify',   l:0.7921, t:0.3882, w:0.0809, h:0.1515, url:LINKS.spotify},
    {id:'z-social',    l:0.3329, t:0.1784, w:0.4185, h:0.1425, url:LINKS.social},
    {id:'z-facebook',  l:0.3651, t:0.2298, w:0.0357, h:0.078, url:LINKS.facebook},
    {id:'z-tiktok',    l:0.4054, t:0.2291, w:0.0357, h:0.0835, url:LINKS.tiktok},
    {id:'z-instagram', l:0.6206, t:0.2151, w:0.0357, h:0.0955, url:LINKS.instagram},
    {id:'z-twitter',   l:0.6624, t:0.2202, w:0.0341, h:0.0869, url:LINKS.twitter},
    {id:'z-twitch',    l:0.4291, t:0.3717, w:0.0671, h:0.0824, url:LINKS.twitch},
    {id:'z-kick',      l:0.5692, t:0.371, w:0.0687, h:0.0807, url:LINKS.kick},
    {id:'z-shopify',   l:0.4595, t:0.5825, w:0.2457, h:0.2297, url:LINKS.shopify},
    {id:'z-patreon',   l:0.8297, t:0.7298, w:0.1354, h:0.1178, url:LINKS.patreon},
  ];

  zoneDefs.forEach(function(z){ document.getElementById(z.id).addEventListener('click',function(e){ goTo(z.url,e); }); });

  // ---- Hover animations ----
  // Each station is a short looping clip laid over one spot of the lair (box = fraction of the lair image).
  // While a station plays, the standing man at the bottom is covered by an empty-floor patch.
  var FLOOR = {src:'images/stations/floor-empty.jpg', l:540/1376, t:588/768, w:320/1376, h:180/768};
  var SOCIALS = ['z-social','z-facebook','z-tiktok','z-instagram','z-twitter'];
  var STATIONS = {
    typing:  {src:'videos/stations/typing.mp4',    l:740/1376, t:280/768, w:320/1376, h:180/768, zones:SOCIALS},
    twitch:  {src:'videos/stations/twitch-v2.mp4', l:480/1376, t:250/768, w:320/1376, h:180/768, zones:['z-twitch']},
    kick:    {src:'videos/stations/kick.mp4',      l:620/1376, t:265/768, w:320/1376, h:180/768, zones:['z-kick']},
    spotify: {src:'videos/stations/spotify.mp4',   l:930/1376, t:250/768, w:320/1376, h:180/768, zones:['z-spotify']},
    shopify: {src:'videos/stations/shopify.mp4',   l:600/1376, t:420/768, w:400/1376, h:225/768, zones:['z-shopify']},
    youtube: {src:'videos/stations/youtube.mp4',   l:0,        t:290/768, w:400/1376, h:225/768, zones:['z-youtube']}
  };
  var floorEl = document.createElement('img');
  floorEl.className = 'station'; floorEl.src = FLOOR.src; floorEl.alt = '';
  overlay.insertBefore(floorEl, overlay.firstChild);   // floor patch sits on top of the clips
  var stationEls = [], current = null, leaveTimer = null;
  function showStation(s){
    clearTimeout(leaveTimer);
    if(current === s) return;                          // moving between zones of the same station: keep playing
    if(current){ var old = current.el; old.classList.remove('on'); setTimeout(function(){ if(current!==old._s) old.pause(); }, 300); }
    current = s;
    s.el.currentTime = 0; var p = s.el.play(); if(p&&p.catch) p.catch(function(){});
    s.el.classList.add('on'); floorEl.classList.add('on');
  }
  function hideStation(){
    clearTimeout(leaveTimer);
    leaveTimer = setTimeout(function(){             // short delay so hopping between overlapping zones doesn't flicker
      if(!current) return;
      var old = current.el; current = null;
      old.classList.remove('on'); floorEl.classList.remove('on');
      setTimeout(function(){ if(!current || current.el!==old) old.pause(); }, 300);
    }, 60);
  }
  Object.keys(STATIONS).forEach(function(k){
    var s = STATIONS[k];
    var v = document.createElement('video');
    v.className = 'station'; v.src = s.src; v.muted = true; v.loop = true;
    v.setAttribute('playsinline',''); v.setAttribute('muted',''); v.preload = 'auto';
    v._s = s;
    overlay.insertBefore(v, overlay.firstChild);
    s.el = v; stationEls.push(s);
    s.zones.forEach(function(zid){
      var zEl = document.getElementById(zid); if(!zEl) return;
      zEl.addEventListener('mouseenter', function(){ showStation(s); });
      zEl.addEventListener('mouseleave', hideStation);
    });
  });
  stationEls.push({el:floorEl, l:FLOOR.l, t:FLOOR.t, w:FLOOR.w, h:FLOOR.h});

  function layout(){
    var r=img.getBoundingClientRect(), cr=container.getBoundingClientRect();
    var ox=r.left-cr.left, oy=r.top-cr.top;
    overlay.style.width=cr.width+'px'; overlay.style.height=cr.height+'px';
    zoneDefs.forEach(function(z){
      var el=document.getElementById(z.id);
      el.style.left=(ox+z.l*r.width)+'px'; el.style.top=(oy+z.t*r.height)+'px';
      el.style.width=(z.w*r.width)+'px';   el.style.height=(z.h*r.height)+'px';
    });
    stationEls.forEach(function(s){
      s.el.style.left=(ox+s.l*r.width)+'px'; s.el.style.top=(oy+s.t*r.height)+'px';
      s.el.style.width=(s.w*r.width)+'px';   s.el.style.height=(s.h*r.height)+'px';
    });
  }
  if(img.complete&&img.naturalWidth>0) layout();
  else img.addEventListener('load',layout);
  window.addEventListener('resize',layout);
}

function goTo(url,e){
  var rpl=document.createElement('div'); rpl.className='ripple';
  rpl.style.left=e.clientX+'px'; rpl.style.top=e.clientY+'px';
  document.body.appendChild(rpl); setTimeout(function(){ rpl.remove(); },600);
  setTimeout(function(){ window.open(url,'_blank'); },200);
}
function tip(n){ var t=document.getElementById('tooltip'); t.textContent='↗ Visit '+n; t.style.opacity='1'; }
function untip(){ document.getElementById('tooltip').style.opacity='0'; }
</script>
</body>
